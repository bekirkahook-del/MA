# Internal notes, scripts and tests are not part of the public site (they used to be downloadable).
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/social/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/guides/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/img/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/calendar.ics"
  to = "/.netlify/functions/calendar"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Self-hosted fonts never change name, so browsers can keep them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Returning visitors get the app instantly from cache; it quietly refreshes in the background
# (stale-while-revalidate), so new deploys still show up on the next visit.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/img/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
