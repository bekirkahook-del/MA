[build]
  publish = "."
  functions = "netlify/functions"
  # Every production deploy costs 15 Netlify credits. Skip the deploy when a push only changes
  # things visitors never load: news data (read straight from GitHub), social/, notes (*.md),
  # guide source scripts, database setup, tests and the YouTube/Discord tooling.
  ignore = '''[ -n "$BRANCH" ] && [ "$BRANCH" != "main" ] && exit 0; C=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" 2>/dev/null); [ -n "$C" ] && ! printf '%s\n' "$C" | grep -qvE '^(data/wire\.json|social/|guides/_src/|supabase/|tests/)|\.md$' '''

# ---------------------------------------------------------------------------------------------------------------
# Security headers for every page (added Nov 17, 2026).
#  - CSP: only this site, Supabase (data + live updates), the Wire feed on GitHub may load or be
#    contacted. No plugins (object-src), no <base> tricks, no framing by other sites (frame-ancestors), forms only post
#    to this site. 'unsafe-inline' stays for scripts/styles because the app uses inline handlers; moving those to
#    event listeners would let us drop it (tracked in SECURITY notes).
#  - Permissions-Policy: the app only needs the microphone (voice answers). Everything else is switched off.
# ---------------------------------------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://cloudflareinsights.com https://nbakxpnhcfzdosbzbupd.supabase.co wss://nbakxpnhcfzdosbzbupd.supabase.co https://raw.githubusercontent.com https://accounts.google.com/gsi/; worker-src 'self' blob:; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# API responses: never cached by browsers or the CDN
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

