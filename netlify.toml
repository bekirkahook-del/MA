[build]
  publish = "."
  functions = "netlify/functions"
  # News refreshes only change data/wire.json, which the site reads straight from GitHub.
  # Skip the deploy when only that file or social/ (TikTok images) changed (saves Netlify credits).
  ignore = '''C=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" 2>/dev/null); [ -n "$C" ] && ! printf '%s\n' "$C" | grep -qvE '^(data/wire\.json|social/)'''

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# keep setup files off the public site
[[redirects]]
  from = "/discord"
  to = "https://discord.gg/aEF6fN8b8C"
  status = 302

[[redirects]]
  from = "/superday"
  to = "/tools/superday-readiness-test/"
  status = 301

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/img/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/calendar.ics"
  to = "/.netlify/functions/calendar"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
