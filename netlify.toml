[build]
  publish = "."
  functions = "netlify/functions"
  # Every production deploy costs 15 Netlify credits. Skip the deploy when a push only changes
  # things visitors never load: news data (read straight from GitHub), social/, notes (*.md),
  # guide source scripts, database setup and the YouTube/Discord tooling.
  ignore = '''C=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" 2>/dev/null); [ -n "$C" ] && ! printf '%s\n' "$C" | grep -qvE '^(data/wire\.json|social/|guides/_src/|supabase/)|\.md$' '''

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# keep setup files off the public site
[[redirects]]
  from = "/youtube"
  to = "https://www.youtube.com/channel/UCecz_zgUGiksG2HpJEt0cTg?sub_confirmation=1"
  status = 302

[[redirects]]
  from = "/tiktok"
  to = "https://www.tiktok.com/@bluechipfinancial"
  status = 302

[[redirects]]
  from = "/instagram"
  to = "https://www.instagram.com/mnaprep/"
  status = 302

[[redirects]]
  from = "/pinterest"
  to = "https://www.pinterest.com/tiktokshopbk29/"
  status = 302

[[redirects]]
  from = "/quora"
  to = "https://www.quora.com/profile/Bekir-Kahook"
  status = 302

[[redirects]]
  from = "/producthunt"
  to = "https://www.producthunt.com/products/m-a-prep"
  status = 302

[[redirects]]
  from = "/discord"
  to = "https://discord.gg/aEF6fN8b8C"
  status = 302

[[redirects]]
  from = "/math"
  to = "/tools/mental-math-test/"
  status = 301

[[redirects]]
  from = "/lbo"
  to = "/tools/lbo-calculator/"
  status = 301

[[redirects]]
  from = "/quiz"
  to = "/tools/finance-career-quiz/"
  status = 301

[[redirects]]
  from = "/superday"
  to = "/tools/superday-readiness-test/"
  status = 301

[[redirects]]
  from = "/timeline"
  to = "/tools/recruiting-timeline-calculator/"
  status = 301

[[redirects]]
  from = "/openings"
  to = "/tools/internship-alerts/"
  status = 301

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/img/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/calendar.ics"
  to = "/.netlify/functions/calendar"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
