<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M&amp;A Prep Redesign Prototype</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Layout: two worlds per the plan. Public = light canvas + brand blue (top bar). App = deep navy workspace (left sidebar desktop, 5-item bottom bar mobile). Single committed palette, set explicitly. */
:root{
  --blue:#2457D6; --blue2:#1d47b3; --navy:#111C2B; --slate:#1B2A3D; --slate2:#22344b; --green:#79D6A2; --canvas:#F3F6FA;
  --ink:#17212B; --ink2:#4a5868; --ink3:#7a8797; --hair:#dfe5ee; --white:#ffffff;
  --dtext:#DCE5EE; --dtext2:#9fb0c3; --dtext3:#6f8399; --dline:#2a3d55; --warn:#e9b65c; --bad:#e8857a;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:#0b1320}
a{color:inherit} h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums} .mono{font-family:var(--mono)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14.5px var(--sans);border-radius:9px;padding:12px 18px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:44px}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue2)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--ink)}.btn.ghost:hover{background:#fff}
.btn.sm{padding:7px 12px;font-size:13px;min-height:34px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sample{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a5a00;background:#fff4dc;border:1px solid #f0d9a6;border-radius:999px;padding:2px 8px}
.app .sample{color:var(--warn);background:#2a2314;border-color:#4b3d20}

/* prototype strip */
.proto{background:#0b1320;color:#c9d6e4;font-size:12.5px;position:relative;z-index:15}
.proto .wrap{display:flex;gap:8px;align-items:center;padding-block:7px;overflow-x:auto;white-space:nowrap}
.proto b{color:var(--green);letter-spacing:.06em}
.proto a{text-decoration:none;color:#9fb0c3;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.proto a.on{border-color:#34496a;color:#fff}
.proto .sep{color:#475a74}
.proto label{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer;color:#fff;font-weight:600;padding-left:12px}

/* compromise note */
.cmp{border:1px dashed #9db4e8;background:#eef3ff;border-radius:var(--r);padding:14px 16px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13.5px}
.cmp h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.cmp ul{margin:0;padding-left:18px}.cmp li{margin:2px 0}
.cmp .k h4{color:#2b7a4b}.cmp .c h4{color:var(--blue)}
.app .cmp{background:#16263b;border-color:#3a5580;color:var(--dtext)}
.app .cmp .k h4{color:var(--green)}.app .cmp .c h4{color:#8fb0ff}
body.nocmp .cmp{display:none}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}

/* PUBLIC top bar */
.pub header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.pub header .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;gap:9px;align-items:center;font-weight:800;font-size:17px;text-decoration:none;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 11px var(--sans);font-style:normal}
.pub nav{display:flex;gap:2px;flex:1;min-width:0}
.pub nav a{text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;padding:8px 11px;border-radius:7px;white-space:nowrap}
.pub nav a:hover,.pub nav a.on{color:var(--ink);background:var(--canvas)}
@media(max-width:860px){.pub nav{display:none}.pub header .wrap{justify-content:space-between;gap:10px}}
@media(max-width:480px){.pub header .btn.ghost{display:none}.logo{white-space:nowrap}}
.pub main{padding-block:28px 72px}
.pcard{background:#fff;border:1px solid var(--hair);border-radius:var(--r)}
.pad{padding:20px}

/* Home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding-block:28px 36px}
.hero h1{font-size:clamp(38px,5.6vw,62px);font-weight:800;letter-spacing:-.035em}
.hero h1 span{color:var(--blue)}
.lede{font-size:18px;color:var(--ink2);max-width:33em;margin:16px 0 24px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.plan{padding:22px}
.plan .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.in{display:flex;flex-direction:column;gap:5px}
.in label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.in input,.in select{font:500 15px var(--sans);color:var(--ink);background:var(--canvas);border:1px solid var(--hair);border-radius:8px;padding:11px 12px;min-height:44px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--sans);border:1px solid var(--hair);background:#fff;color:var(--ink2);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mile{display:flex;flex-direction:column;gap:0;margin-top:14px;border-top:1px solid var(--hair)}
.mile div{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px}
.mile b{width:24px;height:24px;border-radius:50%;background:#e8eefc;color:var(--blue);display:grid;place-items:center;font-size:12px;flex:none}
.mile .lock{color:var(--ink3);filter:blur(.4px)}
section.blk{padding-block:40px;border-top:1px solid var(--hair)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:24px;margin-top:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pillar{padding:22px;border-top:4px solid var(--blue)}
.pillar.p2{border-top-color:#2b8a5a}.pillar.p3{border-top-color:#3f5a7a}
.pillar ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.preview{background:var(--navy);border-radius:14px;padding:16px;color:var(--dtext);box-shadow:0 24px 60px rgba(17,28,43,.28)}
.preview .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--slate);border:1px solid var(--dline);border-radius:9px;padding:12px}
.mini .k{font-size:10.5px;color:var(--dtext3);text-transform:uppercase;letter-spacing:.08em}.mini .v{font-size:18px;font-weight:700;margin-top:2px}
.bar{height:6px;background:#e6ebf2;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.app .bar,.preview .bar{background:#2a3d55}.app .bar>i,.preview .bar>i{background:var(--green)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.tool:hover{border-color:#b9c9ea}
.tool .ex{font-size:12.5px;color:var(--ink3);border-top:1px solid var(--hair);padding-top:8px;margin-top:4px}
.cmpT{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpT ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink2)}
.prices{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.prices span{border:1px solid var(--hair);border-radius:8px;padding:8px 12px;font-size:14px;background:#fff}
.prices b{font-size:18px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.three,.tools{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.three,.tools,.cmpT,.plan .row{grid-template-columns:1fr}.preview .g{grid-template-columns:1fr 1fr}}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.toc a{font-size:13px;color:var(--blue);text-decoration:none;border:1px solid #c9d6f5;border-radius:999px;padding:4px 10px;background:#fff}

/* deals public */
.tbl{overflow-x:auto;border:1px solid var(--hair);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:11px 14px;border-bottom:1px solid var(--hair);background:#fafbfd;cursor:pointer;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--hair)} tr.click{cursor:pointer} tr.click:hover td{background:#f6f8fc}
.co{display:flex;gap:9px;align-items:center}.mark{width:24px;height:24px;border-radius:6px;border:1px solid var(--hair);background:var(--canvas);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink2);flex:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{font:500 14px var(--sans);border:1px solid var(--hair);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink);min-height:40px}
.mcards{display:none}
@media(max-width:640px){.tbl{display:none}.mcards{display:flex;flex-direction:column;gap:10px}}
.fact{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 14px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.tag.f{background:#e6f5ec;color:#1f6b40}.tag.a{background:#e8eefc;color:var(--blue)}
@media(max-width:820px){.fact{grid-template-columns:1fr}}

/* APP shell */
.app{background:var(--navy);color:var(--dtext);min-height:100vh}
.shell{display:grid;grid-template-columns:232px 1fr}
.side{position:sticky;top:0;height:100vh;background:#0e1724;border-right:1px solid var(--dline);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .logo{color:#fff;margin:0 6px 18px}.side .logo i{background:var(--blue)}
.side a.nv{display:flex;gap:11px;align-items:center;text-decoration:none;color:var(--dtext2);font-weight:500;padding:10px 12px;border-radius:8px;font-size:14.5px}
.side a.nv:hover{background:var(--slate);color:#fff}.side a.nv.on{background:var(--slate);color:#fff;box-shadow:inset 3px 0 0 var(--green)}
.side .util{margin-top:auto;border-top:1px solid var(--dline);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.side .me{display:flex;gap:10px;align-items:center;padding:8px;font-size:13.5px}
.ava{width:32px;height:32px;border-radius:50%;background:#2d4566;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.prochip{display:inline-flex;font-size:11px;font-weight:700;color:#0f2a1c;background:var(--green);border-radius:999px;padding:2px 8px}
.amain{min-width:0;padding:26px 28px 90px}
.atop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.atop h1{font-size:24px}
.acard{background:var(--slate);border:1px solid var(--dline);border-radius:var(--r)}
.app .eyebrow{color:var(--dtext3)} .app .muted{color:var(--dtext2)} .app .faint{color:var(--dtext3)}
.app .btn.pri{background:var(--blue)} .app .btn.ghost{border-color:var(--dline);color:var(--dtext)} .app .btn.ghost:hover{background:var(--slate2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--slate2);color:var(--dtext2);border:1px solid var(--dline)}
.pill.ok{color:var(--green);border-color:#2f5c47;background:#15291f}
.pill.urg{color:var(--warn);border-color:#4b3d20;background:#2a2314}
.bottom{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.amain{padding:18px max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px))}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:12;background:#0e1724;border-top:1px solid var(--dline);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
 .bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--dtext3);font-size:11px;font-weight:600;padding:6px 0;min-height:48px}
 .bottom a.on{color:var(--green)} .bottom svg{width:22px;height:22px}}

/* dashboard */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.strip .acard{padding:14px 16px}.strip .v{font-size:20px;font-weight:700;margin-top:3px}.strip small{color:var(--dtext3);font-size:12px}
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}
.next{padding:24px;background:linear-gradient(150deg,#1d3a63,#1B2A3D 62%);border-color:#36598f}
.next h2{font-size:24px;margin:6px 0 6px;color:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--dline);font-size:14px}.li:first-child{border-top:0}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sk{background:#17253a;border:1px solid var(--dline);border-radius:9px;padding:12px}
.sk .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:7px}
.dismiss{background:none;border:0;color:var(--dtext3);cursor:pointer;font-size:12.5px}
@media(max-width:900px){.strip{grid-template-columns:1fr 1fr}.dgrid{grid-template-columns:1fr}.skills{grid-template-columns:1fr 1fr}
 .dgrid .order1{order:1}.dgrid .order2{order:2}}

/* learn path */
.lpath{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.lrow .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--dline);color:var(--dtext3)}
.lrow.done .n{background:var(--green);border-color:var(--green);color:#0f2a1c}.lrow.now{border-color:#36598f}.lrow.now .n{border-color:var(--blue);color:#8fb0ff}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dtext3);margin-top:3px}
@media(max-width:560px){.lrow{grid-template-columns:40px 1fr}.lrow .act{grid-column:2}}

/* practice */
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.mode{padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--slate);border:1px solid var(--dline);border-radius:var(--r)}
.mode.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--dtext3)}
.pw{display:grid;grid-template-columns:1fr 290px;gap:14px}
.qcard{padding:26px}.qcard .q{font-size:21px;font-weight:600;line-height:1.35;margin:14px 0 18px;color:#fff}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font:500 15px var(--sans);color:var(--dtext);background:#17253a;border:1px solid var(--dline);border-radius:9px;padding:13px 15px;cursor:pointer;min-height:48px}
.opt:hover{border-color:#3a5580}.opt.right{border-color:var(--green);background:#15291f}.opt.wrong{border-color:var(--bad);background:#2a1715}
.expl{margin-top:16px;padding:15px;border-radius:9px;background:#14233a;border:1px solid #2c4a72;font-size:14px}
@media(max-width:900px){.modes{grid-template-columns:repeat(3,1fr)}.pw{grid-template-columns:1fr}}
@media(max-width:520px){.modes{grid-template-columns:1fr 1fr}}

/* career */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--dline);margin-bottom:16px;overflow-x:auto}
.tabs button{font:600 14px var(--sans);color:var(--dtext2);background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--green)}
.rm{display:grid;grid-template-columns:1fr 300px;gap:14px}
.period{margin-bottom:14px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--dline)}
.step:first-of-type{border-top:0}
.box{width:20px;height:20px;border-radius:5px;border:2px solid #3a5580;margin-top:2px}.step.done .box{background:var(--green);border-color:var(--green)}
.step.done b{color:var(--dtext3);text-decoration:line-through}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.pcol{background:#17253a;border:1px solid var(--dline);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:150px}
.pcol h4{margin:0;font-size:12px;color:var(--dtext2);display:flex;justify-content:space-between}
.app-c{background:var(--slate);border:1px solid var(--dline);border-radius:8px;padding:10px;font-size:13px}
@media(max-width:900px){.rm{grid-template-columns:1fr}}

/* compete & wire & pro */
.season{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.lb .li b{width:24px}
.how{font-size:13.5px}.how li{margin:4px 0}
.paper{background:#f7f4ec;color:#1c1b17;border-radius:var(--r);padding:22px;font-family:Georgia,'Times New Roman',serif}
.paper h2{font-family:Georgia,serif;font-size:30px;letter-spacing:0;text-align:center;border-top:3px double #1c1b17;border-bottom:3px double #1c1b17;padding:8px 0;margin:6px 0 14px}
.paper .dl{display:flex;justify-content:space-between;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#5d574a}
.paper .secs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid #cfc7b3;margin-bottom:12px}
.paper .secs span{font:600 12px var(--sans);text-align:center;padding:6px 4px;color:#5d574a}
.paper .story{padding:12px 0;border-top:1px solid #dcd4c0}
.paper .story h3{font-family:Georgia,serif;font-size:18px;letter-spacing:0;margin:2px 0 4px}
.paper .src{font:500 12px var(--sans);color:#6b6455}
.paper .tp{font:500 13px var(--sans);background:#ece5d3;border-left:3px solid #8a6d2f;padding:6px 10px;margin-top:6px;color:#3d3728}
.paper .tag{font-family:var(--sans)}
.paper .tag.f{background:#dfeee3}.paper .tag.a{background:#e6e9f5}
@media(max-width:900px){.season{grid-template-columns:1fr}}
@media(max-width:560px){.paper .secs{grid-template-columns:repeat(3,1fr)}}
.fp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fp .acard{padding:22px}.fp ul{padding-left:18px;margin:10px 0 0;font-size:14px}.fp li{margin:5px 0}
.aifb{background:#14233a;border:1px solid #2c4a72;border-radius:9px;padding:14px;font-size:13.5px;margin-top:12px}
@media(max-width:700px){.fp{grid-template-columns:1fr}}
</style>
<style>:root{--sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<div class="proto"><div class="wrap"><b>PROTOTYPE v2</b><span class="sep">·</span><span id="pnav"></span><label><input type="checkbox" id="cmpT" checked> Show compromises</label></div></div>
<div id="root"></div>

<script>
