<script type="module">
import * as THREE from 'three';
const W=1080,H=1920;

const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function box(w,h,d,c,x=0,y=0,z=0,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),Array.isArray(c)?c:M(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(par||scene).add(m);return m}
function canvasTex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function textPlane(lines,{w=3,h=1,bg='#fff',fg='#111',font='bold 64px DejaVu Sans',px=1024}={}){const ph=Math.round(px*h/w);
  const t=canvasTex(px,ph,(g,cw,ch)=>{g.fillStyle=bg;g.fillRect(0,0,cw,ch);g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';const L=[].concat(lines),lh=ch/(L.length+0.6);L.forEach((s,i)=>g.fillText(s,cw/2,lh*(i+0.8)))});
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}))}
/* ---------- people ---------- */
function faceTex(skin,{blink=false,girl=false,shades=false,expr='neutral',open=false}={}){return canvasTex(128,128,(g)=>{g.imageSmoothingEnabled=false;g.scale(2,2);g.fillStyle=skin;g.fillRect(0,0,64,64);
  g.fillStyle='rgba(0,0,0,.08)';g.fillRect(29,30,6,10);/* nose shade */
  g.fillStyle='rgba(230,120,110,.35)';g.fillRect(8,36,8,4);g.fillRect(48,36,8,4);/* cheeks */
  const br=girl?'#2a1a12':'#3a2414';g.fillStyle=br;
  if(expr==='worried'){g.save();g.translate(18,17);g.rotate(0.3);g.fillRect(-7,-2,14,3);g.restore();g.save();g.translate(46,17);g.rotate(-0.3);g.fillRect(-7,-2,14,3);g.restore()}
  else if(expr==='happy'){g.fillRect(11,15,14,3);g.fillRect(39,15,14,3)}
  else if(expr==='shock'){g.fillRect(11,12,14,3);g.fillRect(39,12,14,3)}
  else{g.fillRect(11,16,14,3);g.fillRect(39,16,14,3)}
  if(shades){g.fillStyle='#111';g.fillRect(8,21,21,11);g.fillRect(35,21,21,11);g.fillRect(28,24,8,3);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(10,23,6,2);g.fillRect(37,23,6,2)}
  else{const eh=blink?2:(expr==='shock'?12:10);g.fillStyle='#fff';g.fillRect(12,22,12,eh);g.fillRect(40,22,12,eh);if(!blink){g.fillStyle='#2b1d12';g.fillRect(16,24,7,expr==='shock'?6:7);g.fillRect(44,24,7,expr==='shock'?6:7);g.fillStyle='#fff';g.fillRect(16,24,2,2);g.fillRect(44,24,2,2)}}
  const lip=girl?'#c0505a':'#7a3f2a';g.fillStyle=lip;
  if(open||expr==='shock'){g.fillStyle='#4a1d18';g.fillRect(25,43,14,9);g.fillStyle='#e07a7a';g.fillRect(27,49,10,3)}
  else if(expr==='happy'){g.fillRect(22,45,20,3);g.fillRect(20,42,3,4);g.fillRect(41,42,3,4)}
  else if(expr==='worried'){g.fillRect(24,47,16,3);g.fillRect(22,49,3,3);g.fillRect(39,49,3,3)}
  else g.fillRect(24,46,16,4)})}
function person(o){const P={};const g=new THREE.Group();const skin=o.skin||'#e0b48c';
  const F={};const face=(e,b,op)=>{const k=e+(b?'b':'')+(op?'o':'');if(!F[k])F[k]=faceTex(skin,Object.assign({},o,{expr:e,blink:b,open:op}));return F[k]};const fA=face('neutral'),fB=face('neutral',true);
  const headMat=[M(skin),M(skin),M(skin),M(skin),new THREE.MeshLambertMaterial({map:fA}),M(skin)];
  const hip=new THREE.Group();hip.position.y=0.95;g.add(hip);
  const torso=box(0.62,0.72,0.34,o.shirt||'#2e5bd8',0,0.36,0,hip);
  if(o.tie)box(0.1,0.5,0.02,o.tie,0,0.4,0.18,hip);
  if(o.suit){box(0.2,0.62,0.02,o.suit,-0.2,0.38,0.175,hip);box(0.2,0.62,0.02,o.suit,0.2,0.38,0.175,hip)}
  const neck=new THREE.Group();neck.position.y=0.74;hip.add(neck);
  const head=box(0.5,0.5,0.5,headMat,0,0.27,0,neck);
  const hair=o.hair||'#4a2f1d';
  if(o.hairStyle==='long'){box(0.54,0.16,0.54,hair,0,0.55,0,neck);box(0.54,0.6,0.12,hair,0,0.2,-0.22,neck);box(0.08,0.5,0.5,hair,-0.27,0.25,0,neck);box(0.08,0.5,0.5,hair,0.27,0.25,0,neck)}
  else if(o.hairStyle==='bun'){box(0.54,0.16,0.54,hair,0,0.55,0,neck);box(0.54,0.3,0.12,hair,0,0.42,-0.22,neck);box(0.22,0.22,0.22,hair,0,0.62,-0.22,neck)}
  else if(o.hairStyle==='bald'){box(0.52,0.06,0.52,hair,0,0.53,0,neck)}
  else {box(0.54,0.16,0.54,hair,0,0.55,0,neck);box(0.54,0.22,0.1,hair,0,0.42,-0.22,neck);if(o.hairStyle==='flip')box(0.56,0.08,0.2,hair,0,0.5,0.2,neck)}
  const arm=(s)=>{const a=new THREE.Group();a.position.set(s*0.42,0.66,0);hip.add(a);box(0.2,0.68,0.22,o.sleeve||o.shirt||'#2e5bd8',0,-0.3,0,a);box(0.18,0.14,0.2,skin,0,-0.68,0,a);return a};
  const leg=(s)=>{const l=new THREE.Group();l.position.set(s*0.16,0,0);hip.add(l);box(0.26,0.8,0.28,o.pants||'#2a2f45',0,-0.42,0,l);box(0.28,0.12,0.36,o.shoes||'#1a1a1a',0,-0.86,0.04,l);return l};
  P.face=face;P.expr=o.expr||'neutral';P.g=g;P.hip=hip;P.neck=neck;P.head=head;P.armL=arm(-1);P.armR=arm(1);P.legL=leg(-1);P.legR=leg(1);P.fA=fA;P.fB=fB;P.headMat=headMat;P.mode='idle';P.seed=Math.random()*10;
  if(o.prop==='briefcase'){const bc=box(0.36,0.26,0.1,'#5a3b22',0,-0.86,0.05,P.armR)}
  return P}
function pose(P,t,mode=P.mode){const s=P.seed;const hip=P.hip;hip.rotation.set(0,0,0);hip.position.y=0.95;[P.armL,P.armR,P.legL,P.legR].forEach(x=>x.rotation.set(0,0,0));P.neck.rotation.set(0,0,0);
  const blink=((t+s)%3.4)<0.12,talking=/talk/.test(mode)&&Math.sin(t*14+s)>0;P.headMat[4].map=P.face(P.expr,blink,talking);
  if(mode==='idle'){hip.position.y=0.95+Math.sin(t*2+s)*0.01;P.armL.rotation.z=0.06;P.armR.rotation.z=-0.06;P.neck.rotation.y=Math.sin(t*0.7+s)*0.15}
  if(mode==='walk'){const k=Math.sin(t*7);P.legL.rotation.x=k*0.6;P.legR.rotation.x=-k*0.6;P.armL.rotation.x=-k*0.5;P.armR.rotation.x=k*0.5;hip.position.y=0.95+Math.abs(Math.cos(t*7))*0.04}
  if(mode==='sit'||mode==='type'||mode==='sleep'){hip.position.y=0.62;P.legL.rotation.x=-1.5;P.legR.rotation.x=-1.5;P.armL.rotation.x=-1.1;P.armR.rotation.x=-1.1;
    if(mode==='type'){P.armL.rotation.x=-1.15+Math.sin(t*18+s)*0.07;P.armR.rotation.x=-1.15+Math.cos(t*17+s)*0.07;P.neck.rotation.x=0.12}
    if(mode==='sleep'){P.neck.rotation.x=0.65+Math.sin(t*1.5)*0.04;hip.rotation.x=0.18;P.armL.rotation.x=-1.4;P.armR.rotation.x=-1.4;P.headMat[4].map=P.face(P.expr,true)}}
  if(mode==='cheer'){const k=Math.abs(Math.sin(t*6));P.armL.rotation.z=2.6;P.armR.rotation.z=-2.6;hip.position.y=0.95+k*0.25}
  if(mode==='fist'){P.armR.rotation.z=-2.7+Math.sin(t*10)*0.15;P.armL.rotation.z=0.1}
  if(mode==='panic'){P.armL.rotation.z=2.4+Math.sin(t*14)*0.3;P.armR.rotation.z=-2.4-Math.sin(t*14)*0.3;P.neck.rotation.y=Math.sin(t*9)*0.4;hip.position.x=Math.sin(t*20)*0.03}
  if(mode==='freeze'){P.armL.rotation.z=0.05;P.armR.rotation.z=-0.05;hip.position.x=Math.sin(t*40)*0.015;P.headMat[4].map=P.face(P.expr,false)}
  if(mode==='talk'){P.armR.rotation.x=-0.6+Math.sin(t*4+s)*0.25;P.armR.rotation.z=-0.2;P.neck.rotation.y=Math.sin(t*1.3+s)*0.12}
  if(mode==='sittalk'){pose(P,t,'sit');P.armR.rotation.x=-1.3+Math.sin(t*4+s)*0.2;P.neck.rotation.y=Math.sin(t*1.3+s)*0.15}}
/* ---------- sets ---------- */
function lights(o={}){const a=new THREE.HemisphereLight(o.sky||'#dfe8ff',o.ground||'#3a3a4a',o.hemi||1.1);scene.add(a);
  const rim=new THREE.DirectionalLight(o.rim||'#9fc2ff',o.rimI||0.9);rim.position.set(-5,6,-6);scene.add(rim);
  if(o.fog!==false)scene.fog=new THREE.Fog(o.fogC||(scene.background&&scene.background.getHex?scene.background:'#1b2236'),o.fogN||10,o.fogF||34);
  const d=new THREE.DirectionalLight(o.sun||'#ffffff',o.sunI||1.6);d.position.set(4,9,6);d.castShadow=true;d.shadow.mapSize.set(1024,1024);d.shadow.camera.left=-10;d.shadow.camera.right=10;d.shadow.camera.top=10;d.shadow.camera.bottom=-10;scene.add(d)}
function floor(c,w=30,d=30){const f=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);return f}
function deskWithScreen(x,z,screenTex,{laptop=false,ry=0}={}){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
  box(2.2,0.1,1.0,'#8a5a3a',0,1.0,0,g);[[-1,-.4],[1,-.4],[-1,.4],[1,.4]].forEach(([a,b])=>box(0.1,1.0,0.1,'#6b4429',a,0.5,b,g));
  let scr;if(laptop){box(0.9,0.04,0.6,'#9aa3b5',0,1.07,0.15,g);const lid=new THREE.Group();lid.position.set(0,1.09,-0.14);lid.rotation.x=-0.25;g.add(lid);box(0.92,0.62,0.04,'#9aa3b5',0,0.31,-0.02,lid);
    scr=new THREE.Mesh(new THREE.PlaneGeometry(0.86,0.54),new THREE.MeshBasicMaterial({map:screenTex}));scr.position.set(0,0.31,0.005);lid.add(scr)}
  else{box(0.08,0.5,0.08,'#333',0,1.3,-0.3,g);box(2.1,1.3,0.06,'#222',0,2.15,-0.33,g);scr=new THREE.Mesh(new THREE.PlaneGeometry(2.0,1.2),new THREE.MeshBasicMaterial({map:screenTex}));scr.position.set(0,2.15,-0.295);g.add(scr)}
  box(0.7,0.08,0.7,'#2a2f45',0,0.58,0.9,g);return {g,scr}}
function room(wall='#c9d3e6',fl='#8c95a8'){scene.background=new THREE.Color('#1b2236');lights();floor(fl);const w=new THREE.Mesh(new THREE.PlaneGeometry(30,12),M(wall));w.position.set(0,6,-2.2);w.receiveShadow=true;scene.add(w);
  // window + poster
  const win=textPlane([''],{w:2.2,h:1.6,bg:'#9cc7f0'});win.position.set(-3.2,3.2,-2.18);scene.add(win);box(2.4,0.1,0.1,'#eee',-3.2,2.35,-2.15);
  const po=textPlane(['WALL ST','or bust'],{w:1.2,h:1.6,bg:'#f2c14e',fg:'#13203B',font:'bold 120px DejaVu Sans'});po.position.set(3.4,3.2,-2.18);scene.add(po)}
function campus(){scene.background=new THREE.Color('#8ec5f2');lights({sunI:2});floor('#5aa84f');const bld=new THREE.Group();scene.add(bld);bld.position.set(0,0,-9);
  box(14,5,3,'#b5543c',0,2.5,0,bld);for(let i=-3;i<=3;i++)box(0.5,4,0.5,'#eee',i*1.6,2,1.7,bld);box(15,0.6,3.6,'#ddd',0,5.2,0,bld);
  const s=textPlane(['STATE UNIVERSITY'],{w:6,h:0.9,bg:'#1d3a7a',fg:'#fff',font:'bold 90px DejaVu Sans'});s.position.set(0,4.4,1.95);bld.add(s);
  const path=new THREE.Mesh(new THREE.PlaneGeometry(3,20),M('#d8cfb8'));path.rotation.x=-Math.PI/2;path.position.set(0,0.01,-1);scene.add(path);

function interviewRoom(){scene.background=new THREE.Color('#141a2b');lights({hemi:0.7,sunI:1.2});floor('#3a4256');const w=new THREE.Mesh(new THREE.PlaneGeometry(30,12),M('#2a3350'));w.position.set(0,6,-4);scene.add(w);
  box(5,0.12,1.4,'#5b3a26',0,1.05,-2,);[-2.2,2.2].forEach(x=>box(0.12,1.05,1.2,'#4a2f1f',x,0.52,-2));
  const ivs=[person({shirt:'#e9ecf2',suit:'#2b2f3a',sleeve:'#2b2f3a',tie:'#8a1c1c',hairStyle:'bald',hair:'#888',skin:'#d9a882'}),person({shirt:'#e9ecf2',suit:'#1f2533',sleeve:'#1f2533',tie:'#1c3d8a',hair:'#222',skin:'#a8714a'}),person({shirt:'#f4f4f4',suit:'#3a3340',sleeve:'#3a3340',hairStyle:'bun',hair:'#2a1a12',girl:true,skin:'#e8c3a0'})];

function cafe(){scene.background=new THREE.Color('#2b1d14');lights({sky:'#ffe2b8',hemi:1.0,sunI:1.3,sun:'#ffe9c8'});floor('#6b4a32');const w=new THREE.Mesh(new THREE.PlaneGeometry(30,12),M('#d9b98e'));w.position.set(0,6,-3);scene.add(w);
  const sg=textPlane(['COFFEE'],{w:3,h:0.8,bg:'#3b2416',fg:'#f6d8a8',font:'bold 110px DejaVu Sans'});sg.position.set(0,3.6,-2.95);scene.add(sg);

const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);const back=x=>{x=Math.max(0,Math.min(1,x));const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

  document.getElementById('fade').style.opacity=i===0?Math.max(0,1-lt/0.4):Math.max(0,0.7-lt/0.18);
