<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070B18}canvas{display:block}#t{display:none}</style>
<style>@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf)}@font-face{font-family:IX;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf)}@font-face{font-family:IS;src:url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf)}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><canvas id="t" width="1080" height="1920"></canvas>
<script>
// Liquid-morph ad renderer. window.setup(scenes) then window.frame(t) draws one frame.
const W=1080,H=1920, c=document.getElementById('c');
const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:true,premultipliedAlpha:false});
const VS=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const FS=`precision highp float;varying vec2 uv;
uniform float T,P,S,K;uniform sampler2D A,B;uniform vec3 C1,C2,C3;
// hash/noise
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
const float AR=1080./1920.;
float field(vec2 q){ // metaballs, q in aspect space (x 0..AR, y 0..1)
 float f=0.;float surge=sin(P*3.14159);surge=surge*surge;
 for(int i=0;i<9;i++){float fi=float(i)+S*1.7;
  vec2 c=vec2(AR*(.5+.42*sin(T*(.23+.04*float(i))+fi*2.1)), .5+.44*cos(T*(.19+.03*float(i))+fi*1.3));
  float r=.07+.035*sin(fi*3.7+T*.6) + surge*.55;
  vec2 d=q-c; f+=r*r/dot(d,d);}
 // edge pools so the frame always has liquid at top/bottom
 f+=.010/pow(max(q.y,.001),2.)*0.+ .018/pow(max(1.-q.y+.05*sin(q.x*9.+T),.02),2.)*.25;
 f+=.018/pow(max(q.y+.05*sin(q.x*7.-T*1.3),.02),2.)*.25;
 float band=exp(-pow((q.y-.56)/.16,2.)); f*=mix(1.,.38,band*(1.-surge));
 return f;}
float hgt(vec2 q){float f=field(q);return clamp(1.-1./max(f,.001),0.,1.);}
void main(){
 vec2 q=vec2(uv.x*AR,uv.y);
 // domain warp for liquid wobble
 vec2 w=vec2(fbm(q*3.+T*.25),fbm(q*3.-T*.21+4.))-.5;
 vec2 qw=q+w*.06;
 float f=field(qw);
 float e=.003; float h0=hgt(qw); vec2 g=vec2(hgt(qw+vec2(e,0))-h0,hgt(qw+vec2(0,e))-h0)/e;
 float m=smoothstep(.95,1.05,f);
 // background: deep navy with soft vignette glow
 vec3 bg=mix(vec3(.027,.043,.094),vec3(.07,.09,.2),smoothstep(1.2,0.,length(uv-vec2(.5,.55))*1.4));
 // liquid colour: flowing gradient between brand colours
 float k=fbm(q*1.6+vec2(T*.12,-T*.08));
 vec3 lc=mix(C1,C2,smoothstep(.25,.65,k)); lc=mix(lc,C3,smoothstep(.55,.85,fbm(q*2.3-T*.1)));
 vec3 N=normalize(vec3(-g*.09,1.)); vec3 L=normalize(vec3(-.5,.6,.8));
 float dif=.55+.45*dot(N,L); float spec=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),40.);
 float rim=pow(1.-N.z,1.5);
 vec3 liq=lc*dif+spec*.9+rim*C3*.6;
 vec3 col=mix(bg,liq,m);
 col+=C1*.18*smoothstep(.55,1.,f)*(1.-m); // glow halo
 // text: liquid morph between A and B
 vec2 tu=vec2(uv.x,1.-uv.y);
 float melt=sin(P*3.14159);
 vec2 dsp=(vec2(fbm(tu*6.+T),fbm(tu*6.-T+3.))-.5)*.09*melt;
 float a=texture2D(A,tu+dsp).a, b=texture2D(B,tu-dsp*.7).a;
 vec4 ta=texture2D(A,tu+dsp), tb=texture2D(B,tu-dsp*.7);
 float front=fbm(tu*4.+vec2(0.,T*.3));
 float sel=smoothstep(P*1.4-.25,P*1.4-.1,front); // 1 -> show A, 0 -> show B
 float ga=ta.a*sel*(1.-smoothstep(.35,.6,P)), gb=tb.a*(1.-sel)*smoothstep(.4,.65,P);
 ga=ta.a*sel; gb=tb.a*(1.-sel);
 // gooey threshold so letters look like liquid while morphing
 float th=mix(.0,.45,melt);
 ga=smoothstep(th,th+.12+.5*(1.-melt),ga); gb=smoothstep(th,th+.12+.5*(1.-melt),gb);
 vec3 tc=ta.rgb/max(ta.a,.001)*ga+tb.rgb/max(tb.a,.001)*gb;
 float tA=max(ga,gb);
 // drop shadow
 float sh=max(texture2D(A,tu+dsp+vec2(-.004,.006)).a*sel,texture2D(B,tu-dsp*.7+vec2(-.004,.006)).a*(1.-sel));
 col=mix(col,col*.35,sh*.6*(1.-tA));
 col=mix(col,tc,tA);
 col*=K; // fade in/out
 gl_FragColor=vec4(col,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const hex=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16)/255);
gl.uniform3fv(U('C1'),hex('#0E9AA7'));gl.uniform3fv(U('C2'),hex('#7357F6'));gl.uniform3fv(U('C3'),hex('#16A06A'));
function mkTex(u){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);
 for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t}
const TA=mkTex(0),TB=mkTex(1);gl.uniform1i(U('A'),0);gl.uniform1i(U('B'),1);
const tc=document.getElementById('t'),x=tc.getContext('2d');
let SC=[],cache={};
function draw(i){ // scene -> RGBA canvas
 x.clearRect(0,0,W,H); const s=SC[i]; if(!s) return tc;
 let y=s.y||820;
 for(const l of s.lines){const [txt,font,size,color]=l; x.font=`${size}px ${font}`; x.fillStyle=color||'#fff';x.textAlign='center';x.textBaseline='alphabetic';
  let sz=size; while(x.measureText(txt).width>W-130&&sz>30){sz-=4;x.font=`${sz}px ${font}`}
  x.fillText(txt,W/2,y+sz*.8); y+=sz*1.12+(l[4]||14);}
 return tc;}
function load(u,i){gl.activeTexture(gl.TEXTURE0+u);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,draw(i));}
let curA=-2,curB=-2;
window.setup=s=>{SC=s;return document.fonts.load('100px IB').then(()=>document.fonts.load('100px IX')).then(()=>document.fonts.load('100px IS'))};
const TR=.55; // transition length (s)
window.frame=(t,end)=>{
 // find scene: SC[i].t start times
 let i=0;for(let j=0;j<SC.length;j++)if(t>=SC[j].t-TR/2)i=j;
 const st=SC[i].t; let P=1;
 if(t<st+TR/2){P=(t-(st-TR/2))/TR;P=Math.min(1,Math.max(0,P))}
 const a=P<1?i-1:i, b=i;
 if(a!==curA){load(0,a);curA=a} if(b!==curB){load(1,b);curB=b}
 gl.uniform1f(U('T'),t);gl.uniform1f(U('P'),P);gl.uniform1f(U('S'),i);
 gl.uniform1f(U('K'),Math.min(1,t/.35,(end-t)/.3));
 gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();return true};
</script></body></html>
